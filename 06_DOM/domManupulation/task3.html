<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change background color using button</title>
</head>
<body>
    <h1>Change background color</h1>
    <button onclick="changBgColor()">Change Background Color</button>

    <script>
        function changBgColor () {
            document.body.style.backgroundColor = "lightblue";
        }
    </script>
</body>
</html>
