<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count button clicks</title>
</head>
<body>
    <button onclick="countTheValue()">Click</button>
    <h2>Click :<span id="output">0</span></h2>

    <script>
        let count = 0;

        function countTheValue() {
            count = count + 1 ;
            document.getElementById("output").textContent = count
        }
    </script>
</body>
</html>
