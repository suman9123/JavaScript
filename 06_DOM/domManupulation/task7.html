<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display input value on screen</title>
</head>

<body>
    <input type="text" id="userInput" placeholder="Type Something">
    <button onclick="showValue()">Show Value</button>

    <p id="output"></p>

    <script>
        function showValue() {
            const value = document.getElementById("userInput").value;
           // document.getElementById("output").textContent = "the value is :" + value;
           if(value === "")
                document.getElementById("output").textContent = "Plese Enter soemthing"
            else
                document.getElementById("output").textContent = "the value is :" + value
        }
    </script>
</body>

</html>
